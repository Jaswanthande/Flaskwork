{% extends "base.html" %}

{% block title %}
{{ note.title }} - SNS
{% endblock %}

{% block content %}
<section class="note-detail">
    <div class="page-header">
        <h1>{{ note.title }}</h1>
        <div>
            <a href="{{ url_for('edit_note', note_id=note.id) }}" class="btn btn-edit">Edit</a>
            <a href="{{ url_for('notes') }}" class="btn btn-secondary">Back to Notes</a>
        </div>
    </div>
    <p class="note-content">{{ note.content }}</p>
</section>
{% endblock %}
