{% extends "base.html" %}

{% block title %}
{{ page_title }} - SNS
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>{{ page_title }}</h1>
    <form method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ note.title if note else '' }}"
                maxlength="200"
                required
            >
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required>{{ note.content if note else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary full-width">Save Note</button>
        <a href="{{ url_for('notes') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
